{% load static static_v %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Carga de Calificaciones — Francia "A"</title>
    <link rel="icon" type="image/png" href="{% static 'img/logo_francia.png' %}">
    <link rel="stylesheet" href="{% static 'css/director.css' %}">
    <script src="{% static_v 'js/api.js' %}"></script>

<link rel="stylesheet" href="{% static 'css/profesor_carga_calificaciones.css' %}?v=6">
</head>
<body>

    <!-- ── Sidebar ───────────────────────────────────────────────── -->
    <aside class="sidebar">
        <div class="sidebar-profile">
            <div class="sidebar-avatar">
                <img src="{% static 'img/logo_francia.png' %}" alt="Logo Francia A">
            </div>
            <div class="sidebar-profile-info">
                <span class="profile-name" id="profileName">Republica de Francia 'A'</span>
                <span class="profile-role" id="profileRole">Docente</span>
            </div>
        </div>

        <nav class="sidebar-nav" aria-label="Menú principal">
            <button class="nav-item active" id="sideNotas" aria-label="Notas">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                    <polyline points="14 2 14 8 20 8"/>
                    <line x1="16" y1="13" x2="8" y2="13"/>
                    <line x1="16" y1="17" x2="8" y2="17"/>
                </svg>
                <span class="nav-label">Notas</span>
            </button>
            <button class="nav-item" id="sideCitaciones" aria-label="Citaciones">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                </svg>
                <span class="nav-label">Citaciones</span>
            </button>
            <button class="nav-item profesor-carga-calificaciones-inline-style-1" id="sidePlan" aria-label="Plan de Trabajo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                    <line x1="16" y1="2" x2="16" y2="6"/>
                    <line x1="8"  y1="2" x2="8"  y2="6"/>
                    <line x1="3"  y1="10" x2="21" y2="10"/>
                    <line x1="8"  y1="15" x2="13" y2="15"/>
                    <line x1="8"  y1="18" x2="11" y2="18"/>
                </svg>
                <span class="nav-label">Plan de Trabajo</span>
                <span class="nav-dot" id="planDot"></span>
            </button>
        </nav>

        <div class="sidebar-bottom">
            <button class="nav-item" id="sideCuenta" aria-label="Mi cuenta">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                    <circle cx="12" cy="7" r="4"/>
                </svg>
                <span class="nav-label">Mi Cuenta</span>
            </button>
            <button class="nav-item" id="btnLogout" aria-label="Cerrar sesión">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                    <polyline points="16 17 21 12 16 7"/>
                    <line x1="21" y1="12" x2="9" y2="12"/>
                </svg>
                <span class="nav-label">Cerrar</span>
            </button>
        </div>
    </aside>

    <!-- ── Backdrop móvil ─────────────────────────────────────────── -->
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <!-- ── Topbar (idéntico al dashboard del profesor) ───────────── -->
    <header class="topbar">
        <div class="profesor-carga-calificaciones-inline-style-2">
            <button class="btn-menu" id="btnMenu" aria-label="Abrir menú">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <line x1="3" y1="6"  x2="21" y2="6"/>
                    <line x1="3" y1="12" x2="21" y2="12"/>
                    <line x1="3" y1="18" x2="21" y2="18"/>
                </svg>
            </button>
            <div class="topbar-title-group">
                <h1 class="page-title">Panel Profesor</h1>
                <span class="page-subtitle" id="pageSubtitle">Carga de Calificaciones</span>
            </div>
        </div>
        <div class="topbar-actions">{% include 'profesor/_notif_bell.html' %}</div>
    </header>

    {% include 'profesor/_cc_main.html' %}

    <script src="{% static_v 'js/profesor_carga_calificaciones_inline.js' %}"></script>
    <script src="{% static_v 'js/carga_calificaciones.js' %}"></script>
    <script src="{% static 'js/notif_bell.js' %}"></script>
</body>
</html>
